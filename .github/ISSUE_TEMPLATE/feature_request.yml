name: Change proposal
description: Propose a change to the operating policy, docs, or checks
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        This project stays small on purpose: text only, no runtime
        dependencies, and vendor neutral. Proposals that keep those properties
        are much easier to accept.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, for whom, and how often.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The smallest change that would fix it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: Including doing nothing.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This adds no runtime dependency
        - label: This adds no binary or generated file
        - label: This names no specific assistant or sync service
