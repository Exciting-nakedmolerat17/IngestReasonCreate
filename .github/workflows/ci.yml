name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The project claims to run anywhere with a recent Python and nothing else.
  # This matrix is what makes that claim checkable rather than aspirational.
  checks:
    name: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate public boundary
        run: python scripts/validate_repo.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic smoke checks
        run: python scripts/smoke_test.py

  # Aggregate gate. Branch protection requires this single context, so the
  # matrix above can grow or shrink without reconfiguring the protected branch.
  validate:
    name: validate
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every matrix job passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "Matrix result was '$CHECKS_RESULT', not 'success'."
            exit 1
          fi
          echo "All matrix jobs passed."
